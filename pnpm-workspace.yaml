packages: []

autoInstallPeers: false

peerDependencyRules:
  # DSH SDK packages declare the complete host profile as peers; the installed
  # Web profile supplies those runtime services, while this project only builds
  # against the client contracts it imports.
  ignoreMissing:
    - '@deepseek-ai/*'

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/dsh-client-locale@0.1.1-rc.2'
  - '@deepseek-ai/dsh-client-runtime@0.1.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-conversation@0.1.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-input-trigger@0.1.1-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.1-rc.2'
